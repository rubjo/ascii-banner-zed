name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  release:
    types: [published]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            archive: zip

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: ascii-banner-lsp

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd ascii-banner-lsp/target/${{ matrix.target }}/release
          tar czf ascii-banner-lsp-${{ matrix.target }}.tar.gz ascii-banner-lsp

      - name: Package (zip)
        if: matrix.archive == 'zip'
        run: |
          cd ascii-banner-lsp/target/${{ matrix.target }}/release
          Compress-Archive -Path ascii-banner-lsp.exe -DestinationPath ascii-banner-lsp-${{ matrix.target }}.zip

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ascii-banner-lsp-${{ matrix.target }}
          path: ascii-banner-lsp/target/${{ matrix.target }}/release/ascii-banner-lsp-${{ matrix.target }}.${{ matrix.archive }}
